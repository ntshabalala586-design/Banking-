workflows:
  android-release:
    name: Build Android App Bundle
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      vars:
        CM_BUILD_TOOL: gradle
    scripts:
      - name: Build AAB
        script: |
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/bundle/release/*.aab
